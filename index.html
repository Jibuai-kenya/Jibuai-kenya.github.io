async function ask(){

a.style.display='block';
a.innerText='JIBU is thinking...';
try{
let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});

}catch(e){a.innerText='Error! API Key wrong. Go to aistudio.google.com to get correct key and replace it in code.'}
